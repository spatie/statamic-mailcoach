name: Run Tests

on:
  push:
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5, 8.6]
    
    name: P${{ matrix.php }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2
      
      - name: Install composer dependencies
        uses: ramsey/composer-install@v2
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist --no-interaction --no-suggest"

      - name: Report runtime and dependencies
        run: |
          php -v
          composer show --direct
          composer show laravel/framework
      
      - name: Execute tests
        run: vendor/bin/phpunit --display-deprecations --display-phpunit-deprecations --display-notices --display-warnings
